<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Barkha Enterprises – Cloud Backup</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#14161a;font:17px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 14px;color:#4a4f58}
.c{border:1px solid #e8eaee;border-radius:18px;padding:16px;margin:0 0 14px;background:#f6f7f9}
label{display:block;font-size:13px;font-weight:700;color:#7a808a;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}
input{width:100%;padding:14px;font:inherit;font-size:22px;letter-spacing:6px;text-align:center;border:1.5px solid #e8eaee;border-radius:14px;background:#fff;outline:0}
input:focus{border-color:#14161a}
button,.a{display:block;width:100%;padding:16px;margin:10px 0 0;border:0;border-radius:16px;background:#14161a;color:#fff;font:inherit;font-size:18px;font-weight:600;text-align:center;text-decoration:none}
button.o,.a.o{background:#fff;color:#14161a;border:1.5px solid #14161a}
button:disabled{opacity:.5}
#msg{margin:14px 0 0;padding:14px;border-radius:14px;background:#14161a;color:#fff;font-weight:600;display:none;white-space:pre-line}
#msg.err{background:#c0392b}
small{color:#7a808a;display:block;margin-top:10px}
</style></head><body><main>
<h1>Cloud Backup</h1>
<p>Barkha Enterprises. Saves your bills to the cloud, and brings them back on this or another phone.</p>
<div class="c">
<label for="pin">PIN</label>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
<button id="bs">Save this phone to cloud</button>
<button id="bl" class="o">Load from cloud to this phone</button>
<small>Photos of goods and paper bills are not saved to the cloud. Five wrong PIN tries lock it for 15 minutes.</small>
</div>
<div id="msg"></div>
<a class="a o" href="./index.html">Open the app</a>
</main>
<script>
var URL_='https://xkzmvyajptiiqvmjsuvk.supabase.co',KEY='sb_publishable_fL6curYH2-P1T1qrs7D6Jw_CC90K8h0';
function $(i){return document.getElementById(i)}
function say(m,e){var x=$('msg');x.textContent=m;x.className=e?'err':'';x.style.display='block'}
function busy(b){$('bs').disabled=$('bl').disabled=b}
function pin(){var p=$('pin').value.trim();if(!/^\d{6}$/.test(p)){say('Enter the 6-digit PIN.',1);return null}return p}
async function rpc(fn,body){
  var r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Server error '+r.status));
  return j;
}
function bad(j){
  if(j.error==='locked'){var u=j.until?new Date(j.until).toLocaleTimeString():'';return 'Too many wrong tries. Locked until '+u+'.'}
  if(j.error==='wrong_pin')return 'Wrong PIN. '+j.tries_left+' tries left.';
  return 'Could not continue.';
}
function snap(){
  var o={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('bk_')===0)o[k]=localStorage.getItem(k)}
  try{var b=JSON.parse(o.bk_bills||'[]');b.forEach(function(x){x.goods='';x.paper=''});o.bk_bills=JSON.stringify(b)}catch(e){}
  return {app:'barkha',d:o,at:new Date().toISOString()};
}
$('bs').onclick=async function(){
  var p=pin();if(!p)return;busy(true);say('Saving…');
  try{
    var s=snap(),n=0;try{n=JSON.parse(s.d.bk_bills||'[]').length}catch(e){}
    var j=await rpc('cloud_save',{p_pin:p,p_data:s});
    if(!j.ok)say(bad(j),1);else say('Saved to cloud ('+n+' bills).\n'+new Date().toLocaleString());
  }catch(e){say('Could not save: '+e.message,1)}
  busy(false);
};
$('bl').onclick=async function(){
  var p=pin();if(!p)return;busy(true);say('Loading…');
  try{
    var j=await rpc('cloud_load',{p_pin:p});
    if(!j.ok){say(bad(j),1);busy(false);return}
    var d=j.data;
    if(!d||d.app!=='barkha'||!d.d){say('The cloud is empty. Save from a phone first.',1);busy(false);return}
    var nb=0;try{nb=JSON.parse(d.d.bk_bills||'[]').length}catch(e){}
    var when=j.updated_at?new Date(j.updated_at).toLocaleString():'';
    if(!confirm('This replaces the bills on this phone with the cloud copy ('+nb+' bills, saved '+when+'). Continue?')){say('Cancelled. Nothing changed.');busy(false);return}
    var keep={};
    try{JSON.parse(localStorage.getItem('bk_bills')||'[]').forEach(function(b){if(b.goods||b.paper)keep[b.id]={goods:b.goods||'',paper:b.paper||''}})}catch(e){}
    try{localStorage.setItem('sync_undo',JSON.stringify({at:new Date().toISOString(),bills:localStorage.getItem('bk_bills')}))}catch(e){}
    Object.keys(d.d).forEach(function(k){if(k.indexOf('bk_')===0)localStorage.setItem(k,d.d[k])});
    try{var b2=JSON.parse(localStorage.getItem('bk_bills')||'[]');b2.forEach(function(b){var m=keep[b.id];if(m){b.goods=m.goods;b.paper=m.paper}});localStorage.setItem('bk_bills',JSON.stringify(b2))}catch(e){}
    say('Done. '+nb+' bills loaded on this phone. Tap "Open the app".');
  }catch(e){say('Could not load: '+e.message,1)}
  busy(false);
};
</script></body></html>
